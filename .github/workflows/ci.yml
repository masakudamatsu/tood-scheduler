name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the Update skills workflow start CI on its pull request (docs/adrs/0028).
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
