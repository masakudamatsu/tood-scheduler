# How CodeRabbit reviews pull requests in this repo. Why we use it: docs/adrs/0026-coderabbit-reviews-pull-requests.md
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Plain English: everyday words, short sentences. Say what's wrong, why it matters, and what to change. Explain setting names and labels in words. Write for someone who doesn't know CodeRabbit."

reviews:
  in_progress_fortune: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  # Reviews pull requests into main once they're ready, not drafts. Why: record 0026.
  auto_review:
    enabled: true
  # Skips the modern-web-guidance skill: Google wrote it, and we copy it in unchanged. Why: record 0027.
  path_filters:
    - "!.agents/skills/modern-web-guidance/**"
  path_instructions:
    - path: "tests/**"
      instructions: |
        Look closely when a test's expected result changes (an assertion, an expected value, or a test that's removed or skipped).
        - Check that the same pull request changes the code the test covers, and that the linked issue asks for the new behaviour.
        - Flag a test that's been loosened just so it passes, or an expected result that changed with no matching change in the app's code.
        Also apply the Never do rules in AGENTS.md about the red border and about `npm test`.
    - path: "supabase/schema.sql"
      instructions: |
        Apply the Never do rule in AGENTS.md about `supabase/schema.sql`, and the rules in the change-database skill and in docs/adrs/0012-new-tables-not-exposed.md.
    - path: "src/**"
      instructions: |
        Apply the Never do rules in AGENTS.md about the red border and about server code and secret keys, and its rule about updating the README.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - ".agents/skills/**/SKILL.md"
